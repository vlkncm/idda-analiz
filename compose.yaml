services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idda_analysis
      POSTGRES_USER: ${POSTGRES_USER:-idda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-idda}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-idda_analysis}
      SPORTMONKS_API_KEY: ${SPORTMONKS_API_KEY:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      ARTIFACT_DIR: /app/artifacts
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      - model_artifacts:/app/artifacts
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  postgres_data:
  model_artifacts:
